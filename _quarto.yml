project:
  type: default
  render:
    - "decks/**/index.qmd"
  output-dir: _output

lang: ja

# 公開先（scripts/publish.sh）。デッキから {{< meta site-url >}} で参照する
site-url: https://tool-slides.toshihiro-engineer.workers.dev

# lint 用の HTML コメント（budget 等）が空スライドを作らないよう除く
filters:
  - filters/strip-comments.lua

# コードセル（数値・図の計算）は .venv の Jupyter で実行する。環境変数 QUARTO_PYTHON=.venv/bin/python
execute:
  echo: false
  warning: false
  freeze: auto

format:
  revealjs:
    theme: [default, theme/custom.scss]
    slide-number: true
    hash-type: number
    transition: none
    width: 1280
    height: 720
    margin: 0.06
    fig-width: 13.3   # 幅いっぱい（写真8列×2段で1枚153px）。文字＋図のスライドは max_height_in で高さだけ縮める
    fig-height: 4.4
    mermaid-format: png   # Mermaid は描画時に PNG にする（ブラウザで描くと、Web フォントの読み込み前に箱の大きさが決まり、文字がはみ出す）
    embed-resources: false
  pptx:
    slide-level: 2
  beamer:
    pdf-engine: lualatex
    aspectratio: 169
    fig-width: 5.6
    fig-height: 2.5
    include-in-header:
      text: |
        \usepackage{luatexja-fontspec}
        \setmainjfont{Hiragino Sans}
        \setsansjfont{Hiragino Sans}
